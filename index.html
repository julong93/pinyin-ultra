<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>拼音奥特曼</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#1b2a52 0%,#0d1430 100%);
    color:#fff; min-height:100%; overflow-x:hidden; user-select:none;
    display:flex; flex-direction:column; align-items:center;
  }
  .hidden{ display:none !important; }
  .screen{ width:100%; max-width:480px; padding:18px; display:flex; flex-direction:column; align-items:center; }

  /* 顶部条 */
  .topbar{ width:100%; max-width:480px; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
  .topbar button{ background:#2a3a6a; border:none; color:#cfe0ff; font-size:15px; padding:8px 14px; border-radius:20px; cursor:pointer; }
  .topbar .title{ font-size:17px; opacity:.85; }

  /* 首页 */
  #home{ justify-content:center; gap:26px; padding-top:8vh; }
  .logo{ font-size:44px; font-weight:900; letter-spacing:4px; text-align:center; line-height:1.25;
    background:linear-gradient(90deg,#ffd54a,#ff7676,#5fd0ff); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.4)); }
  .logo small{ display:block; font-size:18px; -webkit-text-fill-color:#cfe0ff; margin-top:6px; letter-spacing:6px; }
  .big-btn{ font-size:26px; font-weight:800; padding:18px 56px; border:none; border-radius:50px; cursor:pointer;
    background:linear-gradient(90deg,#ff8a3d,#ff5f6d); color:#fff; box-shadow:0 8px 24px rgba(255,95,109,.45); letter-spacing:3px; }
  .big-btn:active{ transform:translateY(2px); }
  .ghost-btn{ font-size:19px; padding:13px 40px; border-radius:40px; border:2px solid #4a63a8; background:transparent; color:#cfe0ff; cursor:pointer; }

  /* 地图 */
  .world{ width:100%; margin-bottom:22px; }
  .world-name{ font-size:16px; color:#ffd54a; margin:4px 4px 12px; letter-spacing:2px; }
  .nodes{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .node{ aspect-ratio:1; border-radius:18px; border:none; cursor:pointer; position:relative;
    display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800;
    background:#26356a; color:#fff; box-shadow:inset 0 -4px 0 rgba(0,0,0,.25); }
  .node.done{ background:linear-gradient(160deg,#3ec6a0,#2a9d84); }
  .node.current{ background:linear-gradient(160deg,#ffb03a,#ff7a3d); animation:pulse 1.2s infinite; }
  .node.locked{ background:#1a2447; color:#4a5a8a; cursor:default; }
  .node .star{ position:absolute; top:4px; right:6px; font-size:13px; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,176,58,.6),inset 0 -4px 0 rgba(0,0,0,.25);} 50%{ box-shadow:0 0 0 10px rgba(255,176,58,0),inset 0 -4px 0 rgba(0,0,0,.25);} }

  /* 关卡-学习 */
  #play{ justify-content:flex-start; gap:18px; padding-top:6px; }
  .prompt{ font-size:18px; opacity:.85; height:24px; text-align:center; }
  .learn-card{ display:flex; align-items:center; justify-content:center; gap:18px; margin-top:6px; }
  .py-big{ font-size:120px; font-weight:900; line-height:1;
    background:linear-gradient(180deg,#fff,#bfe0ff); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.4)); cursor:pointer; }
  .hero-box{ width:120px; }
  .hero-box svg{ width:100%; height:auto; filter:drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
  .tones{ display:flex; gap:12px; margin-top:4px; }
  .tone{ font-size:30px; font-weight:800; width:56px; height:56px; border-radius:14px; border:2px solid #4a63a8;
    background:#1c2a55; color:#ffd54a; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .tone:active{ transform:scale(.94); }
  .speaker{ font-size:20px; padding:12px 26px; border-radius:40px; border:none; background:#2a3a6a; color:#cfe0ff; cursor:pointer; }

  /* 关卡-打怪兽 */
  .monsters{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  .monster{ width:110px; height:130px; border-radius:18px; border:none; cursor:pointer; position:relative;
    background:#2a1a3a; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; box-shadow:0 6px 16px rgba(0,0,0,.4); }
  .monster .m-emoji{ font-size:46px; }
  .monster .m-py{ font-size:30px; font-weight:800; color:#ffd54a; }
  .monster.dead{ animation:boom .5s forwards; }
  .monster.wrong{ animation:shake .4s; }
  @keyframes boom{ 0%{transform:scale(1);opacity:1;} 60%{transform:scale(1.3) rotate(8deg);} 100%{transform:scale(0);opacity:0;} }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

  .beam{ position:fixed; inset:0; pointer-events:none; z-index:50; display:flex; align-items:center; justify-content:center; }
  .beam.on::before{ content:""; position:absolute; left:0; right:0; top:50%; height:16px; transform:translateY(-50%);
    background:linear-gradient(90deg,transparent,#8ff0ff,#fff,#8ff0ff,transparent); box-shadow:0 0 30px #8ff0ff; animation:flash .5s; }
  @keyframes flash{ 0%{opacity:0;transform:translateY(-50%) scaleX(0);} 40%{opacity:1;transform:translateY(-50%) scaleX(1);} 100%{opacity:0;} }

  /* ===== 成功特效:火箭齐射 + 烟花 + 星芒 + 彩带 + 闪光 ===== */
  .fx-success{ position:fixed; inset:0; z-index:55; pointer-events:none; overflow:hidden;
    background:radial-gradient(circle at 50% 120%, rgba(30,50,110,.55), rgba(8,12,30,.8)); }

  /* 全屏白光冲击 */
  .fx-flash{ position:absolute; inset:0; background:radial-gradient(circle at 50% 50%, #fff, transparent 60%);
    opacity:0; animation:bigflash .6s ease-out; }
  @keyframes bigflash{ 0%{opacity:0;transform:scale(.2);} 20%{opacity:.9;} 100%{opacity:0;transform:scale(1.6);} }

  /* 旋转金色星芒 */
  .sunburst{ position:absolute; left:50%; top:46%; width:10px; height:10px; transform:translate(-50%,-50%);
    opacity:0; animation:sun 1.9s ease-out; }
  .sunburst::before,.sunburst::after{ content:""; position:absolute; left:50%; top:50%; width:600px; height:600px;
    margin:-300px 0 0 -300px; border-radius:50%;
    background:repeating-conic-gradient(from 0deg, rgba(255,210,90,.55) 0deg 6deg, transparent 6deg 14deg); }
  .sunburst::after{ background:repeating-conic-gradient(from 7deg, rgba(120,220,255,.35) 0deg 5deg, transparent 5deg 16deg); }
  @keyframes sun{ 0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0);}
    25%{opacity:.9;} 100%{opacity:0;transform:translate(-50%,-50%) scale(1.1) rotate(140deg);} }

  .rockets{ position:absolute; inset:0; }
  .rocket{ position:absolute; bottom:-80px; font-size:54px; filter:drop-shadow(0 0 14px #ffca6b); }
  @keyframes launch{
    0%{ transform:translateY(0) scale(.7) rotate(var(--rot)); opacity:0; }
    12%{ opacity:1; }
    100%{ transform:translateY(var(--fly)) scale(1.05) rotate(var(--rot)); opacity:0; }
  }

  .fireworks{ position:absolute; inset:0; }
  .fw{ position:absolute; width:9px; height:9px; border-radius:50%; opacity:0; box-shadow:0 0 8px currentColor; }
  @keyframes burst{
    0%{ transform:translate(0,0) scale(1.2); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0; }
  }
  .fw-core{ position:absolute; width:16px; height:16px; border-radius:50%; opacity:0;
    box-shadow:0 0 30px 10px currentColor; animation:coreflash .55s ease-out forwards; }
  @keyframes coreflash{ 0%{opacity:1;transform:scale(.3);} 60%{opacity:1;transform:scale(1.5);} 100%{opacity:0;} }

  /* 彩带雨 */
  .confetti{ position:absolute; inset:0; }
  .cf{ position:absolute; top:-20px; width:9px; height:15px; opacity:0; border-radius:2px; }
  @keyframes fall{ 0%{opacity:1; transform:translateY(-20px) rotate(0);}
    100%{opacity:1; transform:translateY(110vh) rotate(720deg);} }

  .win-banner{ position:absolute; left:50%; top:20%; transform:translateX(-50%) scale(0);
    font-size:34px; font-weight:900; color:#fff; letter-spacing:2px; white-space:nowrap;
    text-shadow:0 0 18px #ffd54a,0 3px 0 #e0803a; animation:pop 1.6s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop{ 0%{transform:translateX(-50%) scale(0);} 22%{transform:translateX(-50%) scale(1.15);}
    35%{transform:translateX(-50%) scale(1);} 80%{opacity:1;} 100%{opacity:0;transform:translateX(-50%) scale(1);} }

  /* ===== 失败特效:能量爆散 → 石化裂开 → 崩塌 + 灰烬 + 震屏 ===== */
  .fx-fail{ position:fixed; inset:0; z-index:55; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    background:rgba(8,12,30,.65); }
  .fx-fail.quake{ animation:quake .5s 3; }
  @keyframes quake{ 0%,100%{transform:translate(0,0);} 20%{transform:translate(-7px,4px);}
    40%{transform:translate(6px,-5px);} 60%{transform:translate(-5px,-3px);} 80%{transform:translate(4px,5px);} }

  .energy-drain{ position:absolute; left:50%; top:46%; width:12px; height:12px; transform:translate(-50%,-50%); }
  .ep{ position:absolute; left:0; top:0; width:8px; height:8px; border-radius:50%;
    background:#6fe0ff; box-shadow:0 0 12px #6fe0ff; opacity:0; }
  @keyframes drain{ 0%{ transform:translate(var(--sx),var(--sy)) scale(1.4); opacity:1; }
    100%{ transform:translate(0,0) scale(0); opacity:0; } }

  .petrify-wrap{ position:relative; width:150px; }
  .petrify{ width:150px; }
  .petrify svg{ width:100%; height:auto; animation:stone 1.9s ease-in forwards; }
  @keyframes stone{
    0%{ filter:brightness(1.5) drop-shadow(0 0 16px #6fe0ff); transform:scale(1.05); }
    18%{ filter:brightness(1.6) drop-shadow(0 0 20px #6fe0ff); transform:scale(1.07) translateX(-3px); }
    24%{ transform:scale(1.07) translateX(4px); }
    30%{ transform:scale(1.06) translateX(-4px); }
    38%{ filter:brightness(1) drop-shadow(0 0 4px #6fe0ff); transform:scale(1.03) translateX(0); }
    70%{ filter:grayscale(1) brightness(.6) contrast(.85); transform:scale(1); }
    100%{ filter:grayscale(1) brightness(.4) contrast(.7); transform:scale(.9) translateY(14px); opacity:.35; }
  }
  .cracks{ position:absolute; inset:0; pointer-events:none; }
  .crack{ position:absolute; background:rgba(20,20,30,.75); opacity:0;
    animation:crackshow .4s ease-out forwards; transform-origin:top; }
  @keyframes crackshow{ to{ opacity:1; } }

  .ash{ position:absolute; inset:0; }
  .ap{ position:absolute; width:6px; height:6px; border-radius:50%; background:#9aa4b2; opacity:0; }
  @keyframes ashfall{ 0%{opacity:.8; transform:translateY(0) translateX(0);}
    100%{opacity:0; transform:translateY(120px) translateX(var(--ax));} }

  .fail-word{ color:#c8d2e0; font-size:22px; letter-spacing:2px; opacity:0; animation:fadein .6s 1s forwards; }
  @keyframes fadein{ to{ opacity:1; } }

  /* 胜利弹层 */
  .win{ position:fixed; inset:0; z-index:60; background:rgba(8,12,30,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:20px; }
  .win h2{ font-size:30px; color:#ffd54a; letter-spacing:2px; }
  .win .card-reveal{ width:180px; }
  .win .card-reveal svg{ width:100%; }
  .win .card-name{ font-size:20px; font-weight:800; }
  .win-btns{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }

  /* ===== 抽卡:卡带滚动 + 翻转揭晓 ===== */
  .gacha{ width:100%; display:flex; justify-content:center; }
  .gacha.hideout{ opacity:0; transform:scale(.85); transition:opacity .4s, transform .4s; }
  .gacha-viewport{ position:relative; width:min(380px,94vw); height:150px; overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent); }
  .gacha-strip{ display:flex; height:100%; align-items:center; will-change:transform; }
  /* 卡片用固定宽高比(5:7),内容 object-fit:contain,后期换图片素材绝不拉伸 */
  .gcard{ flex:0 0 60px; aspect-ratio:5/7; margin:0 8px; perspective:600px; }
  .gcard-inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; }
  .gcard-back,.gcard-front{ position:absolute; inset:0; border-radius:12px; overflow:hidden;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gcard-back{ font-size:32px; font-weight:900; color:rgba(255,255,255,.9);
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.25); }
  .gacha-marker{ position:absolute; left:50%; top:50%; width:74px; height:106px;
    transform:translate(-50%,-50%); border:3px solid #ffd54a; border-radius:14px;
    box-shadow:0 0 16px rgba(255,213,74,.6); pointer-events:none; }
  .gacha.done .gacha-marker{ opacity:0; transition:opacity .3s; }

  /* 揭晓大卡:放大居中 + 翻转 */
  .big-card{ width:min(210px,58vw); aspect-ratio:5/7; perspective:1000px; }
  .bc-inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; }
  .bc-inner.play{ animation:cardPop .9s cubic-bezier(.2,1.2,.4,1) forwards; }
  @keyframes cardPop{
    0%{ transform:rotateY(0deg) scale(.2); opacity:0; }
    35%{ opacity:1; }
    72%{ transform:rotateY(180deg) scale(1.12); }
    100%{ transform:rotateY(180deg) scale(1); opacity:1; }
  }
  .bc-back,.bc-front{ position:absolute; inset:0; border-radius:18px; overflow:hidden;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .bc-back{ font-size:72px; font-weight:900; color:#fff; box-shadow:inset 0 0 0 4px rgba(255,255,255,.3);
    background:linear-gradient(160deg,#4a63a8,#26356a); }
  .bc-front{ transform:rotateY(180deg); background:#1c2a55;
    box-shadow:0 0 34px 6px #ffd54a, inset 0 0 0 4px #ffd54a; }
  /* 图形/图片按比例显示,绝不拉伸 */
  .bc-front svg{ width:72%; height:auto; }
  .bc-front img{ width:100%; height:100%; object-fit:contain; }
  .bc-front .bc-py{ font-size:24px; font-weight:800; color:#ffd54a; margin-top:6px; }

  /* 稀有卡:四周熠熠生辉(外发光呼吸 + 闪光星星) */
  .big-card{ position:relative; }
  .big-card.rare{ border-radius:18px; animation:rareHalo 1.3s ease-in-out infinite; }
  @keyframes rareHalo{
    0%,100%{ box-shadow:0 0 18px 5px rgba(255,213,74,.55), 0 0 38px 12px rgba(255,213,74,.28); }
    50%{ box-shadow:0 0 40px 14px rgba(255,232,140,.95), 0 0 76px 30px rgba(255,213,74,.5); }
  }
  .bc-front.rareglow{ animation:none; }  /* 发光交给外层 rareHalo */
  /* 四周闪光星星 */
  .sparkles{ position:absolute; inset:-28px; pointer-events:none; z-index:4; }
  .spk{ position:absolute; opacity:0; filter:drop-shadow(0 0 5px #ffe680); animation:spk .9s ease-out forwards; }
  @keyframes spk{
    0%{ opacity:0; transform:scale(.2) rotate(0deg); }
    40%{ opacity:1; transform:scale(1.15) rotate(20deg); }
    100%{ opacity:0; transform:scale(.5) rotate(45deg); }
  }
  .rare-tag{ position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    background:linear-gradient(90deg,#ff8a3d,#ffd54a); color:#5a3200; font-weight:900; font-size:14px;
    padding:4px 14px; border-radius:20px; letter-spacing:1px; white-space:nowrap;
    box-shadow:0 3px 10px rgba(0,0,0,.4); z-index:5; }

  /* 胜利层烟花容器 */
  .win-fw{ position:absolute; inset:0; pointer-events:none; z-index:2; }

  /* 图鉴 */
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%; }
  .card{ background:#1c2a55; border-radius:16px; padding:10px 6px 8px; display:flex; flex-direction:column; align-items:center; gap:4px; position:relative; }
  .card svg{ width:70px; height:auto; }
  .card.locked svg{ filter:grayscale(1) brightness(.35); }
  .card .c-py{ font-size:24px; font-weight:800; color:#ffd54a; }
  .card.locked .c-py{ color:#3a4a7a; }
  .card .c-no{ font-size:12px; opacity:.5; }
  /* 图鉴稀有卡:金色边框 + 星角标 */
  .card.rare{ background:linear-gradient(160deg,#3a2f10,#241c33); box-shadow:0 0 0 2px #ffd54a, 0 0 14px rgba(255,213,74,.5); }
  .card.rare.locked{ box-shadow:0 0 0 2px #6b5a2a; }
  .card .c-star{ position:absolute; top:4px; right:6px; font-size:14px; }
  .count-line{ font-size:15px; opacity:.8; margin-bottom:14px; }
</style>
</head>
<body>

  <!-- 顶部条(地图/图鉴时显示) -->
  <div class="topbar hidden" id="topbar">
    <button id="backBtn">‹ 返回</button>
    <span class="title" id="topTitle"></span>
    <button id="dexBtn">图鉴</button>
  </div>

  <!-- 首页 -->
  <div id="home" class="screen">
    <div class="logo">拼音奥特曼<small>PINYIN ULTRA</small></div>
    <button class="big-btn" id="startBtn">开始冒险</button>
    <button class="ghost-btn" id="restartBtn">🔄 重新开始</button>
    <button class="ghost-btn" id="homeDexBtn">🦸 我的图鉴</button>
    <div style="opacity:.5;font-size:13px;margin-top:10px;text-align:center;line-height:1.6">
      点字母听发音 · 打怪兽闯关 · 收集奥特曼卡片
    </div>
    <div style="opacity:.3;font-size:11px;margin-top:18px;text-align:center;line-height:1.5">
      发音音频来自开源项目 audio-cmn (CC-BY-SA)<br>录音:Chen Wang & Yue Tan
    </div>
  </div>

  <!-- 地图 -->
  <div id="map" class="screen hidden"></div>

  <!-- 关卡 -->
  <div id="play" class="screen hidden">
    <div class="prompt" id="prompt"></div>
    <div id="learnArea"></div>
    <div id="fightArea" class="hidden"></div>
  </div>

  <!-- 图鉴 -->
  <div id="dex" class="screen hidden">
    <div class="count-line" id="dexCount"></div>
    <div class="grid" id="dexGrid"></div>
  </div>

  <!-- 光线特效层 -->
  <div class="beam" id="beam"></div>

  <!-- 成功特效层:火箭齐射+烟花+星芒+彩带 -->
  <div class="fx-success hidden" id="fxSuccess">
    <div class="fx-flash" id="fxFlash"></div>
    <div class="sunburst" id="sunburst"></div>
    <div class="rockets" id="rockets"></div>
    <div class="fireworks" id="fireworks"></div>
    <div class="confetti" id="confetti"></div>
    <div class="win-banner" id="winBanner">🎉 太棒了! 🎉</div>
  </div>

  <!-- 失败特效层:奥特曼能量爆散→石化崩塌 -->
  <div class="fx-fail hidden" id="fxFail">
    <div class="energy-drain" id="energyDrain"></div>
    <div class="petrify-wrap" id="petrifyWrap">
      <div class="petrify" id="petrify"></div>
      <div class="cracks" id="cracks"></div>
    </div>
    <div class="ash" id="ash"></div>
    <div class="fail-word">能量耗尽…再试一次!</div>
  </div>

  <!-- 胜利层 -->
  <div class="win hidden" id="winLayer">
    <div class="win-fw" id="winFw"></div>
    <h2 id="winTitle">✨ 开启卡片 ✨</h2>
    <!-- 抽卡区:卡带滚动 → 定位 → 翻转揭晓 -->
    <div class="gacha" id="gacha">
      <div class="gacha-viewport">
        <div class="gacha-strip" id="gachaStrip"></div>
        <div class="gacha-marker"></div>
      </div>
    </div>
    <!-- 揭晓大卡:跳出轮播框、放大居中展示 -->
    <div class="big-card hidden" id="bigCard">
      <div class="bc-inner" id="bcInner">
        <div class="bc-back">?</div>
        <div class="bc-front" id="bcFront"></div>
      </div>
    </div>
    <div class="card-name" id="winName" style="visibility:hidden"></div>
    <div class="win-btns" id="winBtns" style="visibility:hidden">
      <button class="big-btn" id="nextBtn" style="font-size:20px;padding:14px 34px">下一关 →</button>
      <button class="ghost-btn" id="toMapBtn">回地图</button>
    </div>
  </div>

<script>
  // ========== 拼音数据(say = 用于发音的"呼读音"汉字,尽量准确) ==========
  // type: 'single'单韵母(带声调) 'sm'声母 'compound'复韵母/鼻韵母
  const WORLDS = [
    { name:'第一关·单韵母', items:[
      {id:'a',disp:'a',say:'啊',type:'single'},
      {id:'o',disp:'o',say:'喔',type:'single'},

  // 展平成顺序关卡列表
  const LEVELS = [];

  const MONSTER_EMOJI = ['👾','👹','👺','🐲','🦖','🦕','🐙','🦑','🐉','👽'];

  // ========== 奥特曼头像(CSS/SVG 画,颜色按序号变化;真图以后可替换) ==========
  function heroSVG(idx){

  // ========== 语音(真人录音优先,缺失时回退 TTS) ==========

  const AUDIO_DIR = 'audio';
  // 声母(23个):只有单个录音文件,无声调
  const SM_AUDIO = new Set([
    'b','p','m','f','d','t','n','l','g','k','h','j','q','x',
    'zh','ch','sh','r','z','c','s','y','w'
  ]);

  let curAudio=null;
  function unlockSpeech(){ if('speechSynthesis'in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);} }

  // toneNum: 有四声的拼音指定第几声(1~4);不传时默认第一声
  function playSound(item, toneNum){
    // 先停掉正在播的
    if(curAudio){ try{curAudio.pause();}catch(e){} curAudio=null; }
    if('speechSynthesis'in window) speechSynthesis.cancel();

    let file=null;
    if(TONE_LEVELS.has(item.id)){
      file = `${AUDIO_DIR}/${item.id}${toneNum||1}.mp3`;   // 单韵母/复韵母/鼻韵母:a1.mp3 ai3.mp3 ...
    }else if(SM_AUDIO.has(item.id)){
      file = `${AUDIO_DIR}/${item.id}.mp3`;                // 声母:b.mp3 ...
    }
    if(file){
      const a=new Audio(file);
      curAudio=a;
      a.play().catch(()=>ttsSpeak(item));   // 文件加载/播放失败→回退TTS
      return;
    }
    ttsSpeak(item);                          // 无录音(如 ong)→TTS
  }
  function ttsSpeak(item){
    if(!('speechSynthesis'in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(item.say);
    u.lang='zh-CN'; u.rate=0.8; u.volume=1;
    speechSynthesis.speak(u);

  // ========== 地图 ==========

  // ===== 声调辨别玩法(单韵母/复韵母/鼻韵母)=====
  function startToneFight(i){
    const item=LEVELS[i];
    const marks=TONE_MARKS[item.id];              // ['āi','ái','ǎi','ài']
    const target=Math.floor(Math.random()*4)+1;   // 随机播放第几声(1~4)

    fightArea.innerHTML=`
      <div class="prompt" style="font-size:21px;margin-bottom:2px">仔细听 👂 点出听到的那个<b style="color:#ffd54a">声调</b>!</div>
      <div style="opacity:.6;font-size:14px;margin-bottom:6px">(它们都是「${item.disp}」,只是声调不同)</div>
      <button class="speaker" id="replay">🔊 再听一次</button>
      <div class="monsters" id="monsters"></div>
    `;
    const mwrap=document.getElementById('monsters');
    // 四只怪兽:分别代表第 1~4 声,顺序打乱防止背位置
    const order=[1,2,3,4]; shuffle(order);
    order.forEach(tone=>{
      const emoji=MONSTER_EMOJI[(tone-1)%MONSTER_EMOJI.length];
      const b=document.createElement('button'); b.className='monster';
      b.innerHTML=`<div class="m-emoji">${emoji}</div><div class="m-py">${marks[tone-1]}</div>`;
      b.onclick=()=>{
        if(tone===target) onFightWin(i, b, mwrap);
        else onFightWrong(i, b, mwrap, ()=>playSound(item, target));
      };
      mwrap.appendChild(b);
    });
    setTimeout(()=>playSound(item, target),300);
    document.getElementById('replay').onclick=()=>playSound(item, target);
  }

  // ===== 旧玩法:三选一辨拼音(声母 / ong)=====
  function startPinyinFight(i){
    const item=LEVELS[i];
    const others=LEVELS.map((l,idx)=>idx).filter(idx=>idx!==i);
    shuffle(others);
    const optionIdx=[i, others[0], others[1]];
    shuffle(optionIdx);

    fightArea.innerHTML=`
      <div class="prompt" style="font-size:22px;margin-bottom:6px">听发音,找出 <b style="color:#ffd54a;font-size:28px">${item.disp}</b> 的怪兽!</div>
      <button class="speaker" id="replay">🔊 再听一次</button>
      <div class="monsters" id="monsters"></div>

    optionIdx.forEach(oi=>{
      const opt=LEVELS[oi];

  // ========== 成功/失败特效 ==========

  // 生成一朵烟花(在 x%,y% 处爆开);host 指定容器,默认成功特效层
  function spawnFirework(xPct,yPct,host){
    host = host || fireworksEl;

  // 成功特效:闪光+星芒+火箭齐射+连环烟花+彩带,done 结束后触发

  // 失败音效:用 Web Audio 合成"能量耗尽"下行音(不依赖音频文件)
  let audioCtx=null;
  function failSound(){
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      const t=audioCtx.currentTime;
      // 主体:锯齿波从高滑到低,音量先起后落 —— "哇呜…"泄气感
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      o.type='sawtooth';
      o.frequency.setValueAtTime(440, t);
      o.frequency.exponentialRampToValueAtTime(70, t+0.75);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.28, t+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.9);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t+0.95);
      // 叠加一层低沉方波,增强"沉重坠落"感
      const o2=audioCtx.createOscillator();
      const g2=audioCtx.createGain();
      o2.type='square';
      o2.frequency.setValueAtTime(160, t);
      o2.frequency.exponentialRampToValueAtTime(45, t+0.7);
      g2.gain.setValueAtTime(0.0001, t);
      g2.gain.exponentialRampToValueAtTime(0.14, t+0.08);
      g2.gain.exponentialRampToValueAtTime(0.0001, t+0.85);
      o2.connect(g2).connect(audioCtx.destination);
      o2.start(t); o2.stop(t+0.9);
    }catch(e){}
  }

  // 欢呼音效:滤波白噪声模拟人群欢呼 + 上扬号角琶音(稀有卡揭晓用)
  function cheerSound(){
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      const t=audioCtx.currentTime;
      // 人群欢呼:白噪声经带通滤波,音量起伏
      const dur=2.0;
      const buf=audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate*dur), audioCtx.sampleRate);
      const data=buf.getChannelData(0);
      for(let n=0;n<data.length;n++){
        // 叠加缓慢起伏,模拟人群此起彼伏
        const env=0.6+0.4*Math.sin(n/audioCtx.sampleRate*13);
        data[n]=(Math.random()*2-1)*env;
      }
      const src=audioCtx.createBufferSource(); src.buffer=buf;
      const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1300; bp.Q.value=0.6;
      const g=audioCtx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.32,t+0.15);
      g.gain.linearRampToValueAtTime(0.26,t+1.2);
      g.gain.linearRampToValueAtTime(0.0001,t+dur);
      src.connect(bp).connect(g).connect(audioCtx.destination);
      src.start(t); src.stop(t+dur);
      // 上扬号角琶音 C-E-G-C,营造"稀有揭晓"仪式感
      const notes=[523.25,659.25,783.99,1046.5];
      notes.forEach((f,idx)=>{
        const o=audioCtx.createOscillator(); const og=audioCtx.createGain();
        o.type='triangle'; o.frequency.value=f;
        const st=t+idx*0.13;
        og.gain.setValueAtTime(0.0001,st);
        og.gain.exponentialRampToValueAtTime(0.26,st+0.03);
        og.gain.exponentialRampToValueAtTime(0.0001,st+0.55);
        o.connect(og).connect(audioCtx.destination);
        o.start(st); o.stop(st+0.6);
      });
    }catch(e){}
  }
  function playFailFX(heroIdx, done){
    failSound();                          // 失败音效,与动效同步
    petrifyEl.innerHTML=heroSVG(heroIdx);
    cracksEl.innerHTML=''; ashEl.innerHTML=''; energyDrainEl.innerHTML='';
    fxFail.classList.remove('hidden');
    // 震屏
    fxFail.classList.remove('quake'); void fxFail.offsetWidth; fxFail.classList.add('quake');

    // 能量粒子被吸走(从四周飞向中心)
    for(let k=0;k<14;k++){
      const ep=document.createElement('div'); ep.className='ep';
      const ang=Math.random()*Math.PI*2, dist=60+Math.random()*70;
      ep.style.setProperty('--sx',(Math.cos(ang)*dist)+'px');
      ep.style.setProperty('--sy',(Math.sin(ang)*dist)+'px');
      ep.style.animation=`drain ${0.5+Math.random()*0.4}s ease-in ${Math.random()*200}ms forwards`;
      energyDrainEl.appendChild(ep);
    }
    // 裂纹在石化后陆续出现
    const crackDefs=[
      {t:'42%',l:'50%',w:'3px',h:'55%',r:'8deg'},
      {t:'46%',l:'40%',w:'2px',h:'40%',r:'-22deg'},
      {t:'48%',l:'60%',w:'2px',h:'38%',r:'26deg'},
      {t:'55%',l:'48%',w:'2px',h:'30%',r:'-6deg'},
    ];
    crackDefs.forEach((c,idx)=>{
      setTimeout(()=>{
        const el=document.createElement('div'); el.className='crack';
        el.style.top=c.t; el.style.left=c.l; el.style.width=c.w; el.style.height=c.h;
        el.style.transform=`rotate(${c.r})`;
        cracksEl.appendChild(el);
      }, 700+idx*120);
    });
    // 灰烬飘落
    setTimeout(()=>{
      for(let k=0;k<18;k++){
        const ap=document.createElement('div'); ap.className='ap';
        ap.style.left=(30+Math.random()*40)+'%';
        ap.style.top=(45+Math.random()*15)+'%';
        ap.style.setProperty('--ax',(Math.random()*40-20)+'px');
        ap.style.animation=`ashfall ${1+Math.random()*0.8}s ease-in ${Math.random()*300}ms forwards`;
        ashEl.appendChild(ap);
      }
    }, 1200);
    setTimeout(()=>{ fxFail.classList.add('hidden'); if(done) done(); }, 2100);
  }

  // ========== 胜利:抽卡开箱效果 ==========
  const gachaEl=document.getElementById('gacha');
  const gachaStrip=document.getElementById('gachaStrip');
  const bigCard=document.getElementById('bigCard');
  const bcInner=document.getElementById('bcInner');
  const bcFront=document.getElementById('bcFront');
  const winFwEl=document.getElementById('winFw');
  const CARD_STEP=76;        // 每张卡占位宽(卡60 + 左右margin各8)
  const TARGET_POS=32;       // 目标卡在卡带中的位置(留足前面的滚动距离)
  // 稀有卡:固定 7 个关卡(每个世界都分到,分布均匀),抽到时额外触发烟花+欢呼+发光
  const RARE_LEVELS = new Set([5, 9, 17, 24, 31, 40, 45]);

  // 卡片正面内容 —— 后期换成图片素材,只需改这里(用 <img> + CSS object-fit 保证不拉伸)
  function cardFaceHTML(i){
    // 素材包到位后改为:return `<img src="cards/${LEVELS[i].id}.png" alt="">`;
    return `${heroSVG(i)}<div class="bc-py">${LEVELS[i].disp} · No.${i+1}</div>`;
  }

  // 稀有卡:四周持续冒出闪光星星
  const SPARKLE_STARS=['✨','⭐','✦','🌟','❇️'];
  let rareSparkleTimer=null;
  function spawnSparkle(host){
    const s=document.createElement('span'); s.className='spk';
    s.textContent=SPARKLE_STARS[Math.floor(Math.random()*SPARKLE_STARS.length)];
    s.style.fontSize=(10+Math.random()*16)+'px';
    // 集中在卡片四周边缘(随机选一条边),不遮挡卡面
    const edge=Math.floor(Math.random()*4);
    let x,y;
    if(edge===0){ x=Math.random()*100; y=Math.random()*16; }
    else if(edge===1){ x=Math.random()*100; y=84+Math.random()*16; }
    else if(edge===2){ x=Math.random()*16; y=Math.random()*100; }
    else { x=84+Math.random()*16; y=Math.random()*100; }
    s.style.left=x+'%'; s.style.top=y+'%';
    host.appendChild(s);
    setTimeout(()=>s.remove(),900);
  }
  function stopRareFX(){
    if(rareSparkleTimer){ clearInterval(rareSparkleTimer); rareSparkleTimer=null; }
    const sp=document.getElementById('sparkles'); if(sp) sp.remove();
  }

  function winLevel(i){
    addCard(i);
    if(getUnlocked()===i) setUnlocked(i+1);
    const hasNext = i+1 < LEVELS.length;
    const isRare = RARE_LEVELS.has(i);

    // 复位界面
    document.getElementById('winTitle').textContent='✨ 开启卡片 ✨';
    document.getElementById('winName').style.visibility='hidden';
    document.getElementById('winBtns').style.visibility='hidden';
    gachaEl.classList.remove('hideout','done');
    bigCard.classList.add('hidden');
    bigCard.classList.remove('rare');
    bcInner.classList.remove('play');
    bcFront.classList.remove('rareglow');
    winFwEl.innerHTML='';
    stopRareFX();
    const oldTag=document.getElementById('rareTag'); if(oldTag) oldTag.remove();

    // 生成卡带:大量神秘卡背
    const total=TARGET_POS+6;
    let html='';
    for(let k=0;k<total;k++){
      const hue = Math.floor(Math.random()*360);
      const backBg = `linear-gradient(160deg,hsl(${hue},70%,52%),hsl(${(hue+40)%360},70%,38%))`;
      html+=`<div class="gcard"><div class="gcard-inner">
          <div class="gcard-back" style="background:${backBg}">?</div>
        </div></div>`;
    }
    gachaStrip.innerHTML=html;

    winLayer.classList.remove('hidden');

    // 起点:无过渡瞬间归零
    gachaStrip.style.transition='none';
    gachaStrip.style.transform='translateX(0)';
    void gachaStrip.offsetWidth;

    // 让目标卡停在中间选中框
    const vpW=gachaStrip.parentElement.clientWidth;
    const targetCenter = TARGET_POS*CARD_STEP + CARD_STEP/2;
    const jitter = (Math.random()*30-15);
    const endX = vpW/2 - targetCenter + jitter;
    gachaStrip.style.transition='transform 2.6s cubic-bezier(.12,.62,.2,1)';
    gachaStrip.style.transform=`translateX(${endX}px)`;

    // 滚动结束 → 轮播框收起 → 大卡跳出放大翻转
    setTimeout(()=>{
      gachaEl.classList.add('done','hideout');
      bcFront.innerHTML=cardFaceHTML(i);
      bigCard.classList.remove('hidden');
      void bcInner.offsetWidth;
      bcInner.classList.add('play');

      if(isRare){
        // 稀有卡:翻面完成瞬间 → 欢呼 + 烟花 + 四周熠熠生辉(持续闪光)
        setTimeout(()=>{
          cheerSound();
          bigCard.classList.add('rare');       // 外发光呼吸
          // 稀有角标
          const tag=document.createElement('div'); tag.className='rare-tag'; tag.id='rareTag';
          tag.textContent='⭐ 稀有卡 ⭐'; bigCard.appendChild(tag);
          // 四周持续闪光星星
          const sp=document.createElement('div'); sp.className='sparkles'; sp.id='sparkles';
          bigCard.appendChild(sp);
          rareSparkleTimer=setInterval(()=>{ spawnSparkle(sp); spawnSparkle(sp); }, 130);
          // 卡片四周连环烟花
          const shots=[[30,30],[70,28],[50,18],[25,55],[75,52],[50,45]];
          shots.forEach((p,idx)=> setTimeout(()=>spawnFirework(p[0],p[1],winFwEl), idx*180));
        }, 820);
      }else{
        praise();
      }

      // 大卡弹出完成 → 文字与按钮(稀有卡稍晚,让特效先亮相)
      setTimeout(()=>{
        document.getElementById('winTitle').textContent = isRare ? '🌟 稀有卡 GET! 🌟' : '🎉 获得卡片!';
        const nm=document.getElementById('winName');
        nm.textContent=`${LEVELS[i].disp}  奥特曼  ·  No.${i+1}`;
        nm.style.visibility='visible';
        document.getElementById('nextBtn').style.display = hasNext ? '' : 'none';
        document.getElementById('winBtns').style.visibility='visible';
      }, isRare ? 2400 : 950);
    }, 2750);

    document.getElementById('nextBtn').onclick=()=>{ stopRareFX(); winLayer.classList.add('hidden'); if(hasNext) startLevel(i+1); };
    document.getElementById('toMapBtn').onclick=()=>{ stopRareFX(); winLayer.classList.add('hidden'); renderMap(); };
  }

  // ========== 图鉴 ==========
  function renderDex(){
    const cards=getCards();
    document.getElementById('dexCount').textContent=`已收集 ${cards.length} / ${LEVELS.length} 张奥特曼卡片`;
    const grid=document.getElementById('dexGrid'); grid.innerHTML='';
    LEVELS.forEach((it,i)=>{
      const got=cards.includes(i);
      const rare=RARE_LEVELS.has(i);
      const c=document.createElement('div'); c.className='card'+(got?'':' locked')+(rare?' rare':'');
      const star = rare ? '<div class="c-star">⭐</div>' : '';
      c.innerHTML=`${star}${heroSVG(i)}<div class="c-py">${got?it.disp:'?'}</div><div class="c-no">No.${i+1}</div>`;
      if(got) c.onclick=()=>playSound(it);
      grid.appendChild(c);
    });
    showScreen(dexEl,true,'奥特曼图鉴');
  }

  // ========== 工具 ==========
  function shuffle(arr){ for(let k=arr.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [arr[k],arr[j]]=[arr[j],arr[k]]; } }

  // ========== 导航绑定 ==========
  document.getElementById('startBtn').onclick=()=>{ unlockSpeech(); renderMap(); };
  document.getElementById('restartBtn').onclick=()=>{
    if(confirm('确定要重新开始吗?\n已闯过的关卡和收集的奥特曼卡片都会清空哦!')){
      localStorage.removeItem('py_unlocked');
      localStorage.removeItem('py_cards');
      refreshHome();
      unlockSpeech();
      renderMap();
    }
  };
  document.getElementById('homeDexBtn').onclick=()=>{ renderDex(); };
  document.getElementById('dexBtn').onclick=()=>renderDex();
  document.getElementById('backBtn').onclick=()=>{
    // 从关卡/图鉴返回地图;从地图返回首页
    if(!dexEl.classList.contains('hidden') || !playEl.classList.contains('hidden')) renderMap();
    else showScreen(homeEl,false);
  };

  showScreen(homeEl,false);
</script>
</body>
</html>
